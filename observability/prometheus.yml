# Prometheus scrape config. Runs on your Mac (or a cloud box) and scrapes the
# vLLM /metrics endpoint through the cloudflared tunnel.
#
# IMPORTANT: the free trycloudflare URL changes every Kaggle session. Update the
# `target` below each time, or use a named cloudflared tunnel for a stable host.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "vllm"
    metrics_path: /metrics
    scheme: https                       # trycloudflare serves https
    static_configs:
      - targets:
          # strip the https:// — put only host[:port] here, e.g.:
          - "YOUR-TUNNEL.trycloudflare.com"
        labels:
          plane: gpu
          experiment: "tp2"             # tag each run so you can filter in Grafana
